<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-3 Omad G'ildiragi 🏆</title>
    <!-- Canvas Confetti chiroyli pirotexnika effekti uchun -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --accent-color: #f59e0b;
            --text-color: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(245, 158, 11, 0.1);
            max-width: 950px;
            width: 100%;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 850px) {
            .main-container {
                flex-direction: column;
                text-align: center;
                padding: 15px;
            }
        }

        /* G'ildirak bo'limi mobilbop qilindi */
        .wheel-section {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1.2;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        canvas {
            width: 100% !important;
            height: auto !important;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.2), 0 0 0 8px #1f2937;
            /* Ba'zi brauzerlardagi xatolikni oldini olish uchun CSS transition olib tashlandi */
        }

        .center-circle {
            position: absolute;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #ffffff 0%, #d1d5db 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-weight: bold;
            color: #090d16;
            font-size: 0.85rem;
            user-select: none;
            z-index: 5;
            border: 3px solid #1f2937;
        }

        /* Boshqaruv bo'limi */
        .control-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #f59e0b, #ef4444, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: #090d16;
            border: 2px solid #374151;
            border-radius: 14px;
            padding: 12px;
            color: var(--text-color);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        textarea:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spin-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #090d16;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.5);
        }

        .spin-btn:disabled {
            background: #374151 !important;
            color: #6b7280 !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Shohsupa (Podium) dizayni */
        .podium-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px 10px;
            min-height: 150px;
            margin-top: 5px;
        }

        .podium-place {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 30%;
        }

        .podium-name {
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            min-height: 20px;
            color: #9ca3af;
            word-break: break-all;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .podium-block {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            color: #090d16;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .place-2 .podium-block {
            height: 45px;
            background: linear-gradient(to top, #94a3b8, #cbd5e1);
        }
        .place-1 .podium-block {
            height: 75px;
            background: linear-gradient(to top, #d97706, #fcd34d);
        }
        .place-3 .podium-block {
            height: 30px;
            background: linear-gradient(to top, #b45309, #f97316);
        }

        .current-status {
            text-align: center;
            font-weight: bold;
            color: #60a5fa;
            font-size: 1rem;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Chap tomon: G'ildirak -->
    <div class="wheel-section">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        <div class="center-circle" onclick="triggerTournament()">GO!</div>
    </div>

    <!-- O'ng tomon: Boshqaruv va Shohsupa -->
    <div class="control-section">
        <div>
            <h1>Top-3 G'oliblar G'ildiragi</h1>
            <p style="color: #6b7280; margin-top: 3px; font-size: 0.9rem;">Kamida 3 ta ism kiriting va o'rinlarni aniqlang!</p>
        </div>

        <textarea id="optionsInput">Jasur&#10;Malika&#10;Sardor&#10;Kamola&#10;Diyor&#10;Madina&#10;Bobur&#10;Lola</textarea>

        <button class="spin-btn" id="spinBtn" onclick="startTournament()">Musobaqani Boshlash! 🏆</button>

        <div class="current-status" id="statusBox">Tayyormisiz? Tugmani bosing!</div>

        <!-- Shohsupa -->
        <div class="podium-container">
            <!-- 2-O'rin -->
            <div class="podium-place place-2">
                <div class="podium-name" id="name-2">-</div>
                <div class="podium-block">2</div>
            </div>
            <!-- 1-O'rin -->
            <div class="podium-place place-1">
                <div class="podium-name" id="name-1">-</div>
                <div class="podium-block">1</div>
            </div>
            <!-- 3-O'rin -->
            <div class="podium-place place-3">
                <div class="podium-name" id="name-3">-</div>
                <div class="podium-block">3</div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const optionsInput = document.getElementById('optionsInput');
    const spinBtn = document.getElementById('spinBtn');
    const statusBox = document.getElementById('statusBox');

    const colors = ['#f59e0b', '#3b82f6', '#10b981', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#14b8a6'];

    let currentAngleRad = 0; // Radian o'lchovida saqlaymiz
    let isSpinning = false;
    let audioCtx = null;
    
    let activeParticipants = [];
    let currentPlaceToDraw = 3;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTickSound() {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function playWinSound(place) {
        initAudio();
        if (!audioCtx) return;
        const freqs = place === 1 ? [523.25, 659.25, 783.99, 1046.50] : [392.00, 493.88, 587.33, 783.99];
        freqs.forEach((freq, index) => {
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }, index * 100);
        });
    }

    function getOptions() {
        return optionsInput.value.split('\n')
            .map(opt => opt.trim())
            .filter(opt => opt.length > 0);
    }

    function drawWheel() {
        const list = isSpinning ? activeParticipants : getOptions();
        const numSegments = list.length;
        const radius = canvas.width / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (numSegments === 0) {
            ctx.fillStyle = '#6b7280';
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("Ro'yxat bo'sh...", radius, radius);
            return;
        }

        const arcSize = (2 * Math.PI) / numSegments;

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(currentAngleRad); // Butun canvasni aylantiramiz
        ctx.translate(-radius, -radius);

        for (let i = 0; i < numSegments; i++) {
            const angle = i * arcSize;
            ctx.fillStyle = colors[i % colors.length];
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius - 5, angle, angle + arcSize);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle + arcSize / 2);
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px sans-serif';
            
            let text = list[i];
            if (text.length > 12) text = text.substring(0, 10) + '..';
            
            ctx.fillText(text, radius - 25, 0);
            ctx.restore();
        }
        ctx.restore();
    }

    function triggerTournament() {
        if (!isSpinning) startTournament();
    }

    function startTournament() {
        if (isSpinning) return;

        activeParticipants = getOptions();
        if (activeParticipants.length < 3) {
            alert("Iltimos, kamida 3 ta ishtirokchi kiriting!");
            return;
        }

        document.getElementById('name-1').innerText = '-';
        document.getElementById('name-2').innerText = '-';
        document.getElementById('name-3').innerText = '-';
        
        currentPlaceToDraw = 3; 
        runSingleSpin();
    }

    function runSingleSpin() {
        isSpinning = true;
        spinBtn.disabled = true;
        optionsInput.disabled = true;

        statusBox.innerText = `🌀 ${currentPlaceToDraw}-o'rin aniqlanmoqda...`;

        const numSegments = activeParticipants.length;
        const arcSize = (2 * Math.PI) / numSegments;
        
        // Tasodifiy qo'shimcha aylanish kuchi
        const extraSpin = (Math.random() * 2 * Math.PI) + (8 * Math.PI); 
        const startAngle = currentAngleRad;
        const targetAngle = startAngle + extraSpin;
        
        const startTime = performance.now();
        const duration = 4000; 
        let lastTickSegment = -1;

        function animate(timestamp) {
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            // Silliq sekinlashish effekti (Cubic Ease Out)
            const easeOut = 1 - Math.pow(1 - progress, 3);
            currentAngleRad = startAngle + (extraSpin * easeOut);
            
            drawWheel();

            // Ovoz effekti hisobi (Mil yuqorida 12 soat yo'nalishida tutilgan: -Math.PI / 2)
            const currentPointerAngle = (-currentAngleRad - Math.PI / 2) % (2 * Math.PI);
            const normalizedPointer = currentPointerAngle < 0 ? currentPointerAngle + (2 * Math.PI) : currentPointerAngle;
            const currentSegment = Math.floor(normalizedPointer / arcSize) % numSegments;

            if (currentSegment !== lastTickSegment && progress < 0.95) {
                playTickSound();
                lastTickSegment = currentSegment;
            }

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                // To'xtagan joyni normallashtirish
                currentAngleRad = targetAngle % (2 * Math.PI);
                
                // G'olib indeksini aniq hisoblash formula xatosi to'g'rilandi
                const finalPointerAngle = (-currentAngleRad - Math.PI / 2) % (2 * Math.PI);
                const finalNormalized = finalPointerAngle < 0 ? finalPointerAngle + (2 * Math.PI) : finalPointerAngle;
                const winnerIndex = Math.floor(finalNormalized / arcSize) % numSegments;
                
                const winner = activeParticipants[winnerIndex];

                // Ekranga chiqarish
                document.getElementById(`name-${currentPlaceToDraw}`).innerText = winner;
                document.getElementById(`name-${currentPlaceToDraw}`).style.color = 
                    currentPlaceToDraw === 1 ? '#fcd34d' : (currentPlaceToDraw === 2 ? '#cbd5e1' : '#f97316');

                playWinSound(currentPlaceToDraw);

                confetti({
                    particleCount: 60,
                    spread: 50,
                    origin: { y: 0.6 }
                });

                // G'olibni o'chirib, ro'yxatni yangilaymiz
                activeParticipants.splice(winnerIndex, 1);
                
                setTimeout(() => {
                    if (currentPlaceToDraw > 1) {
                        currentPlaceToDraw--;
                        // Keyingi bosqichdan oldin g'ildirakni yangi ismlar bilan qayta chizamiz
                        drawWheel();
                        runSingleSpin(); 
                    } else {
                        statusBox.innerText = "🏆 Musobaqa yakunlandi! Tabriklaymiz! 🏆";
                        
                        // Final super salyut!
                        let end = Date.now() + (1.5 * 1000);
                        (function frame() {
                            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                            if (Date.now() < end) {
                                requestAnimationFrame(frame);
                            }
                        }());

                        isSpinning = false;
                        spinBtn.disabled = false;
                        optionsInput.disabled = false;
                        drawWheel();
                    }
                }, 2000); 
            }
        }

        requestAnimationFrame(animate);
    }

    // Matn o'zgarganda g'ildirak yangilanishi
    optionsInput.addEventListener('input', () => {
        if (!isSpinning) {
            currentAngleRad = 0; // Yangi ro'yxat kiritilganda g'ildirak holatini nollaymiz
            drawWheel();
        }
    });

    // Ilk yuklash
    drawWheel();
</script>

</body>
</html>
