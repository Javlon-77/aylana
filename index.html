<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-3 G'oliblar G'ildiragi 🏆</title>
    <style>
        :root {
            --bg-color: #0f1319;
            --card-bg: #171d26;
            --accent-color: #f59e0b;
            --text-color: #f3f4f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-container {
            display: flex;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-width: 1000px;
            width: 100%;
            gap: 40px;
            align-items: center;
            justify-content: center;
        }
        /* G'ildirak vizuali */
        .wheel-box {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ef4444;
            z-index: 10;
        }
        canvas {
            border: 8px solid #2d3748;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .center-btn {
            position: absolute;
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #111;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 4px solid #2d3748;
            user-select: none;
            z-index: 5;
        }
        /* O'ng tomon paneli */
        .control-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 {
            margin: 0;
            font-size: 32px;
            color: var(--text-color);
        }
        h1 span { color: #3b82f6; }
        .subtitle {
            margin: -10px 0 10px 0;
            color: #94a3b8;
            font-size: 15px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #0f141c;
            border: 2px solid #2d3748;
            border-radius: 10px;
            color: white;
            padding: 12px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus { border-color: #3b82f6; }
        .action-btn {
            background: #2e3746;
            color: #94a3b8;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .action-btn.active {
            background: #2563eb;
            color: white;
        }
        .action-btn.active:hover { background: #1d4ed8; }
        
        .status-text {
            color: #3b82f6;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 27px;
            font-weight: 500;
        }
        /* Shoxsupa qismi */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            margin-top: 10px;
            height: 150px;
        }
        .podium-place {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
        }
        .podium-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            min-height: 24px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .podium-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #111;
            border-radius: 6px 6px 0 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .p2 .podium-bar { background: #cbd5e1; height: 60px; }
        .p1 .podium-bar { background: #f59e0b; height: 90px; }
        .p3 .podium-bar { background: #ea580c; height: 40px; color: white; }
        .p2 .podium-name { color: #cbd5e1; }
        .p1 .podium-name { color: #f59e0b; }
        .p3 .podium-name { color: #ea580c; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid transparent;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="390" height="390"></canvas>
            <div class="center-btn" id="centerGoBtn" onclick="startFullLottery()">GO!</div>
        </div>

        <div class="control-panel">
            <h1>Top-3 G'oliblar <span>G'ildiragi</span></h1>
            <div class="subtitle">Ismlarni kiriting va ketma-ket 3 ta o'rinni aniqlang!</div>
            
            <textarea id="namesTextarea" oninput="onNamesChange()">Jasur\nMalika\nSardor\nKamola\nDiyor\nMadina\nBobur\nLola</textarea>
            
            <button class="action-btn active" id="startBtn" onclick="startFullLottery()">Musobaqani Boshlash! 🏆</button>

            <div class="status-text">
                <div class="spinner" id="statusSpinner"></div>
                <span id="statusMessage"></span>
            </div>

            <div class="podium-container">
                <div class="podium-place p2">
                    <div class="podium-name" id="namePlace2">-</div>
                    <div class="podium-bar">2</div>
                </div>
                <div class="podium-place p1">
                    <div class="podium-name" id="namePlace1">-</div>
                    <div class="podium-bar">1</div>
                </div>
                <div class="podium-place p3">
                    <div class="podium-name" id="namePlace3">-</div>
                    <div class="podium-bar">3</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const textarea = document.getElementById('namesTextarea');
        
        let names = [];
        const colors = ['#f59e0b', '#3b82f6', '#10b981', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#14b8a6'];
        let isSpinning = false;
        let currentRotation = 0;

        // OVOZLAR
        const spinAudio = new Audio('https://mixkit.co');
        const winAudio = new Audio('https://mixkit.co');
        spinAudio.loop = true;

        function init() {
            onNamesChange();
        }

        function onNamesChange() {
            names = textarea.value.split('\n')
                                  .map(name => name.trim())
                                  .filter(name => name !== "");
            drawWheel(0);
        }

        // Tahrirlangan va muammosi to'g'rilangan G'ildirak chizish funksiyasi
        function drawWheel(currentAngle) {
            const numSegments = names.length;
            if (numSegments === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }
            const segmentAngle = (2 * Math.PI) / numSegments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(currentAngle);

            for (let i = 0; i < numSegments; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, canvas.width / 2, i * segmentAngle, (i + 1) * segmentAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.rotate(i * segmentAngle + segmentAngle / 2);
                // TUZATILGAN JOYI: Faqatgina joriy element ismi yoziladi
                ctx.fillText(names[i], canvas.width / 2 - 20, 0);
                ctx.restore();
            }
            ctx.restore();
        }

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function startFullLottery() {
            if (isSpinning) return;
            if (names.length < 3) {
        alert("Iltimos, g'olibni aniqlash uchun kamida 3 ta ism kiriting!");
        return;
    }

    isSpinning = true;
    toggleButtons(false);
    
    document.getElementById('namePlace1').innerText = "-";
    document.getElementById('namePlace2').innerText = "-";
    document.getElementById('namePlace3').innerText = "-";

    let pool = [...names];
    let shuffled = pool.sort(() => 0.5 - Math.random());
    let winner3 = shuffled[0];
    let winner2 = shuffled[1];
    let winner1 = shuffled[2];

    // 3-o'rinni aniqlash
    animateSpinStep(winner3, "3-o'rin aniqlanmoqda...", (found3) => {
        document.getElementById('namePlace3').innerText = found3;
        winAudio.play();
        
        // 2-o'rinni aniqlash
        setTimeout(() => {
            animateSpinStep(winner2, "2-o'rin aniqlanmoqda...", (found2) => {
                document.getElementById('namePlace2').innerText = found2;
                winAudio.play();
                
                // 1-o'rinni aniqlash
                setTimeout(() => {
                    animateSpinStep(winner1, "1-o'rin (Bosh g'olib) aniqlanmoqda...", (found1) => {
                        document.getElementById('namePlace1').innerText = found1;
                        winAudio.play();
                        
                        setStatus("", false);
                        isSpinning = false;
                        toggleButtons(true);
                    });
                }, 1500);
            });
        }, 1500);
    });
}

function animateSpinStep(targetWinner, message, callback) {
    setStatus(message, true);
    spinAudio.play();

    const targetIndex = names.indexOf(targetWinner);
    const numSegments = names.length;
    const segmentAngle = (2 * Math.PI) / numSegments;
    
    const targetAngleInSegment = segmentAngle / 2; 
    const desiredAngle = (3 * Math.PI / 2) - (targetIndex * segmentAngle) - targetAngleInSegment;
    
    const extraRotations = 2 * Math.PI * randomRange(3, 5);
    const finalRotation = currentRotation + extraRotations + (desiredAngle - (currentRotation % (2 * Math.PI)));

    const startTime = performance.now();
    const duration = 3000;

    function update(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easeOutQuad = 1 - (1 - progress) * (1 - progress);
        const currentAngle = currentRotation + (finalRotation - currentRotation) * easeOutQuad;
        
        drawWheel(currentAngle);

        if (progress < 1) {
            requestAnimationFrame(update);
        } else {
            currentRotation = finalRotation;
            spinAudio.pause();
            spinAudio.currentTime = 0;
            callback(targetWinner);
        }
    }
    requestAnimationFrame(update);
}

function setStatus(text, showSpinner) {
    document.getElementById('statusMessage').innerText = text;
    document.getElementById('statusSpinner').style.display = showSpinner ? 'block' : 'none';
}

function toggleButtons(enable) {
    const startBtn = document.getElementById('startBtn');
    if (enable) {
        startBtn.classList.add('active');
        textarea.disabled = false;
    } else {
        startBtn.classList.remove('active');
        textarea.disabled = true;
    }
}

window.onload = init;
