<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-3 Omad G'ildiragi 🏆</title>
    <!-- Canvas Confetti chiroyli pirotexnika effekti uchun -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --accent-color: #f59e0b;
            --text-color: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(245, 158, 11, 0.1);
            max-width: 950px;
            width: 100%;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* G'ildirak bo'limi */
        .wheel-section {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1.2;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            display: none;
        }

        canvas {
            width: 100% !important;
            height: auto !important;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.2), 0 0 0 8px #1f2937;
            display: none;
        }

        /* Boshlang'ich oval quti */
        .placeholder-circle {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: radial-gradient(circle, #1f2937 0%, #0f172a 100%);
            border: 6px dashed rgba(245, 158, 11, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #9ca3af;
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            animation: pulse 2s infinite ease-in-out;
        }

        .placeholder-circle span {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); border-color: rgba(245, 158, 11, 0.4); }
            50% { transform: scale(0.98); border-color: rgba(245, 158, 11, 0.8); }
        }

        .center-circle {
            position: absolute;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #ffffff 0%, #d1d5db 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-weight: bold;
            color: #090d16;
            font-size: 0.85rem;
            user-select: none;
            z-index: 5;
            border: 3px solid #1f2937;
            display: none;
        }

        /* Boshqaruv bo'limi */
        .control-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(45deg, #f59e0b, #ef4444, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        textarea {
            width: 100%;
            height: 110px;
            background-color: #090d16;
            border: 2px solid #374151;
            border-radius: 14px;
            padding: 12px;
            color: var(--text-color);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus { border-color: var(--accent-color); }
        textarea:disabled { opacity: 0.5; cursor: not-allowed; }

        .spin-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #090d16;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.5);
        }

        .spin-btn:disabled {
            background: #374151 !important;
            color: #6b7280 !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Shohsupa */
        .podium-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px 10px;
            min-height: 140px;
            margin-top: 5px;
        }

        .podium-place {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 32%;
        }

        .podium-name {
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 6px;
            min-height: 20px;
            color: #9ca3af;
            word-break: break-all;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .podium-block {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            color: #090d16;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .place-2 .podium-block { height: 45px; background: linear-gradient(to top, #94a3b8, #cbd5e1); }
        .place-1 .podium-block { height: 75px; background: linear-gradient(to top, #d97706, #fcd34d); }
        .place-3 .podium-block { height: 32px; background: linear-gradient(to top, #b45309, #f97316); }

        .current-status {
            text-align: center;
            font-weight: bold;
            color: #60a5fa;
            font-size: 0.95rem;
            min-height: 24px;
        }

        @media (max-width: 850px) {
            body { padding: 10px; align-items: flex-start; }
            .main-container { flex-direction: column; text-align: center; padding: 20px 15px; gap: 20px; }
            .wheel-section { max-width: 290px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="wheel-section">
        <div class="pointer" id="wheelPointer"></div>
        <div class="placeholder-circle" id="placeholderBox">
            <span>🎯</span>
            Ismlarni kiriting va turnirni boshlang!
        </div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        <div class="center-circle" id="centerGoBtn" onclick="triggerTournament()">GO!</div>
    </div>

    <div class="control-section">
        <div>
            <h1>Top-3 G'oliblar G'ildiragi</h1>
            <p style="color: #6b7280; margin-top: 3px; font-size: 0.85rem;">Ismlarni kiriting (1 ta bo'lsa ham ishlaydi!)</p>
        </div>

        <textarea id="optionsInput" placeholder="Jasur&#10;Malika"></textarea>
        <button class="spin-btn" id="spinBtn" onclick="startTournament()">Musobaqani Boshlash! 🏆</button>
        <div class="current-status" id="statusBox">Ismlarni yozib, tugmani bosing!</div>

        <div class="podium-container">
            <div class="podium-place place-2">
                <div class="podium-name" id="name-2">-</div>
                <div class="podium-block">2</div>
            </div>
            <div class="podium-place place-1">
                <div class="podium-name" id="name-1">-</div>
                <div class="podium-block">1</div>
            </div>
            <div class="podium-place place-3">
                <div class="podium-name" id="name-3">-</div>
                <div class="podium-block">3</div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const optionsInput = document.getElementById('optionsInput');
    const spinBtn = document.getElementById('spinBtn');
    const statusBox = document.getElementById('statusBox');
    
    const placeholderBox = document.getElementById('placeholderBox');
    const wheelPointer = document.getElementById('wheelPointer');
    const centerGoBtn = document.getElementById('centerGoBtn');

    const colors = ['#f59e0b', '#3b82f6', '#10b981', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#14b8a6'];

    let currentAngleRad = 0; 
    let isSpinning = false;
    let audioCtx = null;
    
    let activeParticipants = [];
    let currentPlaceToDraw = 3;
    let originalCount = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTickSound() {
        initAudio(); if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(900, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.04);
    }

    // Har bir o'ringa mos o'ziga xos mukammal g'alaba ohangi
    function playWinSound(place) {
        initAudio(); if (!audioCtx) return;
        let notes = [];
        if (place === 3) notes = [392.00, 493.88, 587.33]; // G major shaddod ohang
        if (place === 2) notes = [440.00, 554.37, 659.25, 880.00]; // A major yanada baland ohang
        if (place === 1) notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C major Oltin final madhiyasi

        notes.forEach((freq, index) => {
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = index % 2 === 0 ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }, index * 120);
        });
    }

    // Nishonlash effekti (Salyut portlashi va olqishlar)
    function playCelebrationSound() {
        initAudio(); if (!audioCtx) return;
        
        // Salyut Shovqini (Pirotexnika portlashi)
        const bufferSize = audioCtx.sampleRate * 0.4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(400, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.4);
        
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start();
    }

    function getOptions() {
        return optionsInput.value.split('\n')
            .map(opt => opt.trim())
            .filter(opt => opt.length > 0);
    }

    function drawWheel() {
        const list = isSpinning ? activeParticipants : getOptions();
        const numSegments = list.length;
        const radius = canvas.width / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (numSegments === 0) return;

        const arcSize = (2 * Math.PI) / numSegments;

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(currentAngleRad); 
        ctx.translate(-radius, -radius);

        for (let i = 0; i < numSegments; i++) {
            const angle = i * arcSize;
            ctx.fillStyle = colors[i % colors.length];
            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius - 5, angle, angle + arcSize);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle + arcSize / 2);
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px sans-serif';
            
            let text = list[i];
            if (text.length > 12) text = text.substring(0, 10) + '..';
            
            ctx.fillText(text, radius - 25, 0);
            ctx.restore();
        }
        ctx.restore();
    }

    function triggerTournament() { if (!isSpinning) startTournament(); }

    function startTournament() {
        if (isSpinning) return;

        activeParticipants = getOptions();
        originalCount = activeParticipants.length;

        if (originalCount < 1) {
            alert("Iltimos, kamida 1 ta ism kiriting!");
            return;
        }

        placeholderBox.style.display = 'none';
        canvas.style.display = 'block';
        wheelPointer.style.display = 'block';
        centerGoBtn.style.display = 'flex';

        document.getElementById('name-1').innerText = '-';
        document.getElementById('name-2').innerText = '-';
        document.getElementById('name-3').innerText = '-';
        
        // Nechta odam borligiga qarab turnir qaysi o'rindan boshlanishi aniqlanadi
        currentPlaceToDraw = Math.min(3, originalCount);
        runSingleSpin();
    }

    function runSingleSpin() {
        isSpinning = true;
        spinBtn.disabled = true;
        optionsInput.disabled = true;

        statusBox.innerText = `🌀 ${currentPlaceToDraw}-o'rin aniqlanmoqda...`;

        const numSegments = activeParticipants.length;
        const arcSize = (2 * Math.PI) / numSegments;
        
        const extraSpin = (Math.random() * 2 * Math.PI) + (8 * Math.PI); 
        const startAngle = currentAngleRad;
        const targetAngle = startAngle + extraSpin;
        
        const startTime = performance.now();
        const duration = 3500; 
        let lastTickSegment = -1;

        function animate(timestamp) {
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            const easeOut = 1 - Math.pow(1 - progress, 3);
            currentAngleRad = startAngle + (extraSpin * easeOut);
            
            drawWheel();

            const currentPointerAngle = (-currentAngleRad - Math.PI / 2) % (2 * Math.PI);
            const normalizedPointer = currentPointerAngle < 0 ? currentPointerAngle + (2 * Math.PI) : currentPointerAngle;
            const currentSegment = Math.floor(normalizedPointer / arcSize) % numSegments;

            if (currentSegment !== lastTickSegment && progress < 0.94) {
                playTickSound();
                lastTickSegment = currentSegment;
            }

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                currentAngleRad = targetAngle % (2 * Math.PI);
                
                const finalPointerAngle = (-currentAngleRad - Math.PI / 2) % (2 * Math.PI);
                const finalNormalized = finalPointerAngle < 0 ? finalPointerAngle + (2 * Math.PI) : finalPointerAngle;
                const winnerIndex = Math.floor(finalNormalized / arcSize) % numSegments;
                
                const winner = activeParticipants[winnerIndex];

                // Ekranga o'rin g'olibini yozish
                document.getElementById(`name-${currentPlaceToDraw}`).innerText = winner;
                document.getElementById(`name-${currentPlaceToDraw}`).style.color = 
                    currentPlaceToDraw === 1 ? '#fcd34d' : (currentPlaceToDraw === 2 ? '#cbd5e1' : '#f97316');

                // Effektlar va maxsus ovozlar ijrosi
                playWinSound(currentPlaceToDraw);
                playCelebrationSound();

                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { y: 0.6 }
                });

                activeParticipants.splice(winnerIndex, 1);
                
                setTimeout(() => {
                    if (currentPlaceToDraw > 1 && activeParticipants.length > 0) {
                        currentPlaceToDraw--;
                        drawWheel();
                        runSingleSpin(); 
                    } else {
                        statusBox.innerText = "🏆 Musobaqa yakunlandi! Tabriklaymiz! 🏆";
                        
                        // Final super nishonlash salyuti
                        let end = Date.now() + (1.5 * 1000);
                        (function frame() {
                            confetti({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0 } });
                            confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1 } });
                            if (Date.now() < end) {
                                requestAnimationFrame(frame);
                            }
                        }());

                        isSpinning = false;
                        spinBtn.disabled = false;
                        optionsInput.disabled = false;
                        drawWheel();
                    }
                }, 2200); 
            }
        }
        requestAnimationFrame(animate);
    }

    optionsInput.addEventListener('input', () => {
        if (!isSpinning) { currentAngleRad = 0; drawWheel(); }
    });
</script>

</body>
</html>
